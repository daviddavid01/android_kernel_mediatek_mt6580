name: Ultimate Smart Self-Healing Kernel Compiler

on:
  workflow_dispatch:

jobs:
  smart-build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Fully Automate System Prerequisites & Repair Dependencies
      run: |
        echo "Installing robust base build environments..."
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev tclsh findutils xz-utils bison flex git libelf-dev ccache libuutil-dev libncurses-dev
        
        # Self-Healing System Linkage Repair for older kernel engines
        echo "Validating path binaries..."
        sudo ln -sf /usr/bin/bison /usr/bin/yacc || true
        sudo ln -sf /usr/bin/flex /usr/bin/lex || true

    - name: Explicit Downloader for Legacy Toolchain
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        cd $GITHUB_WORKSPACE/toolchain
        git clone --depth=1 https://googlesource.com

    - name: Smart Auto-Discovery Engine (No Guessing)
      id: discovery
      run: |
        echo "===== EXECUTING AUTO-DETECTION ====="
        
        # 1. Dynamic Defconfig Scanner
        # Scans for rainbow configuration first, then any mtk/mediatek files, falling back to the first available config file
        if [ -f "arch/arm/configs/rainbow_defconfig" ]; then
          FOUND_CONFIG="rainbow_defconfig"
        else
          FOUND_CONFIG=$(find arch/arm/configs/ -name "*rainbow*" -o -name "*mt6580*" -o -name "*mtk*" | head -n 1 | xargs basename)
          if [ -z "$FOUND_CONFIG" ]; then
            FOUND_CONFIG=$(find arch/arm/configs/ -maxdepth 1 -type f | head -n 1 | xargs basename)
          fi
        fi
        
        if [ -z "$FOUND_CONFIG" ]; then
          echo "CRITICAL REPAIR: No baseline config files found anywhere. Creating a generic default..."
          mkdir -p arch/arm/configs
          touch arch/arm/configs/fallback_defconfig
          FOUND_CONFIG="fallback_defconfig"
        fi
        echo "Target Configuration Settled: $FOUND_CONFIG"
        echo "DETECTED_DEFCONFIG=$FOUND_CONFIG" >> $GITHUB_ENV
        
        # 2. Dynamic Frequency File Locator
        TARGET_FREQ=$(find . -name "mt_cpufreq.c" | head -n 1)
        if [ -n "$TARGET_FREQ" ]; then
          # Strip leading dot/
          TARGET_FREQ=$(echo "$TARGET_FREQ" | sed 's|^\./||')
          echo "Target Frequency Controller Tracked At: $TARGET_FREQ"
          echo "DETECTED_FREQ_FILE=$TARGET_FREQ" >> $GITHUB_ENV
        else
          echo "WARNING: Frequency map file not found. Disabling Overclock branch logic."
          echo "DETECTED_FREQ_FILE=NOT_FOUND" >> $GITHUB_ENV
        fi

    - name: Configure Master Compiler Environments
      run: |
        echo "ARCH=arm" >> $GITHUB_ENV
        echo "SUBARCH=arm" >> $GITHUB_ENV
        echo "CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-" >> $GITHUB_ENV

    # ==================== BUILD LOOP 1: AUTOMATED STOCK BUILD ====================
    - name: Automated Baseline Build Strategy
      id: compile_stock
      run: |
        echo "Processing Config Init via $DETECTED_DEFCONFIG..."
        make O=out $DETECTED_DEFCONFIG
        
        echo "Triggering Primary Build Cycle..."
        # If compilation fails, the script catches it, scans logs for common errors, fixes them, and retries.
        if ! make O=out -j$(nproc); then
          echo "====== COMPILER REPAIR MODE ACTIVATED ======"
          echo "Self-Healing Strategy: Checking for legacy time/gcc declaration errors..."
          
          # Repair Fix 1: Inline Macro definition failures in legacy kernels
          find out/ -name "*.h" -o -name "*.c" | xargs sed -i 's/extern inline/static inline/g' 2>/dev/null || true
          
          # Repair Fix 2: Common Makefile warnings treated as hard errors (-Werror) remove patch
          find . -name "Makefile" | xargs sed -i 's/-Werror//g' || true
          
          echo "Restarting Recovery Build Attempt..."
          if ! make O=out -j$(nproc); then
             echo "Critical Error: Kernel build environment unrecoverable with standard automation fixes."
             echo "baseline_success=false" >> $GITHUB_OUTPUT
             exit 1
          fi
        fi
        
        if [ -f "out/arch/arm/boot/zImage" ]; then
          echo "Baseline Build Fully Succeeded!"
          mkdir -p $GITHUB_WORKSPACE/output_binaries
          cp out/arch/arm/boot/zImage $GITHUB_WORKSPACE/output_binaries/zImage-stock
          echo "baseline_success=true" >> $GITHUB_OUTPUT
        else
          echo "baseline_success=false" >> $GITHUB_OUTPUT
          exit 1
        fi

    # ==================== BUILD LOOP 2: AUTOMATED SMART OVERCLOCK ====================
    - name: Autonomous Overclock Injector & Build
      if: steps.compile_stock.outputs.baseline_success == 'true' && env.DETECTED_FREQ_FILE != 'NOT_FOUND'
      run: |
        echo "Deploying system mods to target path: $DETECTED_FREQ_FILE"
        
        # Double check if array profile structure exists to avoid corrupting code files
        if grep -q "struct cpu_frequency_info mt6580_freqs" "$DETECTED_FREQ_FILE"; then
          # Dynamic injection exactly below array head profile mapping
          sed -i '/struct cpu_frequency_info mt6580_freqs\[\] = {/a \ \ \ \ \{1495000, 1275\},' $DETECTED_FREQ_FILE
          echo "Overclock array parameters injected flawlessly."
        else
          echo "Unique layout architecture detected. Appending overclock frequency bracket to general speed array maps..."
          sed -i '/freqs\[\] = {/a \ \ \ \ \{1495000, 1275\},' $DETECTED_FREQ_FILE || true
        fi
        
        echo "Purging old artifact build frames..."
        rm -rf out/
        
        echo "Compiling Modded Hardware Profiles..."
        make O=out $DETECTED_DEFCONFIG
        
        if make O=out -j$(nproc); then
          if [ -f "out/arch/arm/boot/zImage" ]; then
             echo "Automated Overclock Build Phase Successful!"
             cp out/arch/arm/boot/zImage $GITHUB_WORKSPACE/output_binaries/zImage-overclocked
          fi
        else
          echo "Overclock configuration code broke core tree modules. Reverting build execution."
          exit 1
        fi

    # ==================== EXPORT REPOSITORY BINARIES ====================
    - name: Dispatch Outputs to Actions Hub
      uses: actions/upload-artifact@v4
      with:
        name: MT6580-AutoEngine-Outputs
        path: ${{ github.workspace }}/output_binaries/*
