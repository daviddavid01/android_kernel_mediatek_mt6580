name: Ultimate Descending Container Auto-Compiler

on:
  workflow_dispatch:

jobs:
  descending-compile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Output Directories
      run: mkdir -p ${{ github.workspace }}/output_binaries

    # ==================== CRITICAL SYSTEM DETECTION ====================
    - name: Smart Auto-Discovery Engine
      id: discovery
      run: |
        echo "===== EXECUTING AUTO-DETECTION ====="
        if [ -f "arch/arm/configs/rainbow_defconfig" ]; then
          FOUND_CONFIG="rainbow_defconfig"
        else
          FOUND_CONFIG=$(find arch/arm/configs/ -name "*rainbow*" -o -name "*mt6580*" -o -name "*mtk*" | head -n 1 | xargs basename)
          if [ -z "$FOUND_CONFIG" ]; then
            FOUND_CONFIG=$(find arch/arm/configs/ -maxdepth 1 -type f | head -n 1 | xargs basename)
          fi
        fi
        echo "DETECTED_DEFCONFIG=$FOUND_CONFIG" >> $GITHUB_ENV
        
        TARGET_FREQ=$(find . -name "mt_cpufreq.c" | head -n 1)
        if [ -n "$TARGET_FREQ" ]; then
          TARGET_FREQ=$(echo "$TARGET_FREQ" | sed 's|^\./||')
          echo "DETECTED_FREQ_FILE=$TARGET_FREQ" >> $GITHUB_ENV
        else
          echo "DETECTED_FREQ_FILE=NOT_FOUND" >> $GITHUB_ENV
        fi

    # ==================== STEP 1: DOWNLOADING TOOLCHAIN ====================
    - name: Download Legacy GCC 4.9 Toolchain
      run: |
        mkdir -p ${{ github.workspace }}/toolchain
        cd ${{ github.workspace }}/toolchain
        git clone --depth=1 https://googlesource.com

    # ==================== STEP 2: MULTI-ERA DESCENDING COMPILATION ENGINE ====================
    - name: Try Compiling Stock - Modern Tier (Host Ubuntu-Latest)
      id: build_host
      continue-on-error: true
      run: |
        echo "=== Attempting Compilation on Host (Modern Ubuntu) ==="
        sudo apt-get update && sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex libelf-dev
        export ARCH=arm
        export SUBARCH=arm
        export CROSS_COMPILE=${{ github.workspace }}/toolchain/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-
        make O=out $DETECTED_DEFCONFIG
        make O=out -j$(nproc)
        if [ -f "out/arch/arm/boot/zImage" ]; then echo "success=true" >> $GITHUB_OUTPUT; else exit 1; fi

    - name: Fallback 1 - Descend to Ubuntu 20.04 Container
      id: build_u20
      if: steps.build_host.outputs.success != 'true'
      continue-on-error: true
      run: |
        echo "=== Host Failed. Descending Environment to Ubuntu 20.04 Container ==="
        docker run --rm -v ${{ github.workspace }}:${{ github.workspace }} -w ${{ github.workspace }} ubuntu:20.04 sh -c '
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex libelf-dev libtinfo5
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=${{ github.workspace }}/toolchain/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-
          rm -rf out/
          make O=out $DETECTED_DEFCONFIG
          make O=out -j$(nproc)
        '
        if [ -f "out/arch/arm/boot/zImage" ]; then echo "success=true" >> $GITHUB_OUTPUT; else exit 1; fi

    - name: Fallback 2 - Descend to Ubuntu 18.04 Container
      id: build_u18
      if: steps.build_host.outputs.success != 'true' && steps.build_u20.outputs.success != 'true'
      continue-on-error: true
      run: |
        echo "=== Ubuntu 20.04 Failed. Descending Environment to Ubuntu 18.04 Container ==="
        docker run --rm -v ${{ github.workspace }}:${{ github.workspace }} -w ${{ github.workspace }} ubuntu:18.04 sh -c '
          apt-get update && apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex libelf-dev
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=${{ github.workspace }}/toolchain/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-
          rm -rf out/
          make O=out $DETECTED_DEFCONFIG
          make O=out -j$(nproc)
        '
        if [ -f "out/arch/arm/boot/zImage" ]; then echo "success=true" >> $GITHUB_OUTPUT; else exit 1; fi

    - name: Fallback 3 - Descend to Vintage Ubuntu 16.04 Container (Highly Likely For MT6580)
      id: build_u16
      if: steps.build_host.outputs.success != 'true' && steps.build_u20.outputs.success != 'true' && steps.build_u18.outputs.success != 'true'
      continue-on-error: true
      run: |
        echo "=== Ubuntu 18.04 Failed. Descending Environment to Ubuntu 16.04 Container ==="
        docker run --rm -v ${{ github.workspace }}:${{ github.workspace }} -w ${{ github.workspace }} ubuntu:16.04 sh -c '
          apt-get update && apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex libelf-dev
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=${{ github.workspace }}/toolchain/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-
          find . -name "Makefile" | xargs sed -i "s/-Werror//g" || true
          rm -rf out/
          make O=out $DETECTED_DEFCONFIG
          make O=out -j$(nproc)
        '
        if [ -f "out/arch/arm/boot/zImage" ]; then echo "success=true" >> $GITHUB_OUTPUT; else exit 1; fi

    - name: Fallback 4 - Absolute Minimum Descend to Legacy Ubuntu 14.04 Container
      id: build_u14
      if: steps.build_host.outputs.success != 'true' && steps.build_u20.outputs.success != 'true' && steps.build_u18.outputs.success != 'true' && steps.build_u16.outputs.success != 'true'
      continue-on-error: true
      run: |
        echo "=== Ubuntu 16.04 Failed. Descending to Original Kernel Era Ubuntu 14.04 Container ==="
        docker run --rm -v ${{ github.workspace }}:${{ github.workspace }} -w ${{ github.workspace }} ubuntu:14.04 sh -c '
          apt-get update && apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=${{ github.workspace }}/toolchain/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-
          find . -name "Makefile" | xargs sed -i "s/-Werror//g" || true
          rm -rf out/
          make O=out $DETECTED_DEFCONFIG
          make O=out -j$(nproc)
        '
        if [ -f "out/arch/arm/boot/zImage" ]; then echo "success=true" >> $GITHUB_OUTPUT; else exit 1; fi

    # ==================== EVALUATE BASELINE & COPY ====================
    - name: Verify Baseline Succeeded in Any Container Era
      id: verify_baseline
      run: |
        if [ "${{ steps.build_host.outputs.success }}" = "true" ] || \
           [ "${{ steps.build_u20.outputs.success }}" = "true" ] || \
           [ "${{ steps.build_u18.outputs.success }}" = "true" ] || \
           [ "${{ steps.build_u16.outputs.success }}" = "true" ] || \
           [ "${{ steps.build_u14.outputs.success }}" = "true" ]; then
          echo "A baseline kernel was built successfully!"
          cp out/arch/arm/boot/zImage ${{ github.workspace }}/output_binaries/zImage-stock
          echo "any_baseline_passed=true" >> $GITHUB_OUTPUT
          
          if [ "${{ steps.build_host.outputs.success }}" = "true" ]; then echo "WORKING_ERA=host" >> $GITHUB_ENV;
          elif [ "${{ steps.build_u20.outputs.success }}" = "true" ]; then echo "WORKING_ERA=ubuntu:20.04" >> $GITHUB_ENV;
          elif [ "${{ steps.build_u18.outputs.success }}" = "true" ]; then echo "WORKING_ERA=ubuntu:18.04" >> $GITHUB_ENV;
          elif [ "${{ steps.build_u16.outputs.success }}" = "true" ]; then echo "WORKING_ERA=ubuntu:16.04" >> $GITHUB_ENV;
          else echo "WORKING_ERA=ubuntu:14.04" >> $GITHUB_ENV; fi
        else
          echo "CRITICAL ERROR: All descending containers failed compilation."
          exit 1
        fi

    # ==================== STEP 3: AUTOMATED OVERCLOCK IN THE WORKING CONTAINER ====================
    - name: Inject Overclock & Compile in Working Era Container
      if: steps.verify_baseline.outputs.any_baseline_passed == 'true' && env.DETECTED_FREQ_FILE != 'NOT_FOUND'
      run: |
        echo "Injecting Overclock Mod to: $DETECTED_FREQ_FILE"
        sed -i '/struct cpu_frequency_info mt6580_freqs\[\] = {/a \ \ \ \ \{1495000, 1275\},' $DETECTED_FREQ_FILE || sed -i '/freqs\[\] = {/a \ \ \ \ \{1495000, 1275\},' $DETECTED_FREQ_FILE || true
        rm -rf out/

        if [ "$WORKING_ERA" = "host" ]; then
          export ARCH=arm && export SUBARCH=arm && export CROSS_COMPILE=${{ github.workspace }}/toolchain/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-
          make O=out $DETECTED_DEFCONFIG && make O=out -j$(nproc)
        else
          docker run --rm -v ${{ github.workspace }}:${{ github.workspace }} -w ${{ github.workspace }} $WORKING_ERA sh -c '
            apt-get update && apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex libelf-dev libtinfo5 || true
            export ARCH=arm
            export SUBARCH=arm
            export CROSS_COMPILE=${{ github.workspace }}/toolchain/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-
            find . -name "Makefile" | xargs sed -i "s/-Werror//g" || true
            make O=out $DETECTED_DEFCONFIG
            make O=out -j$(nproc)
          '
        fi

        if [ -f "out/arch/arm/boot/zImage" ]; then
          cp out/arch/arm/boot/zImage ${{ github.workspace }}/output_binaries/zImage-overclocked
          echo "Overclock Kernel compiled successfully in environment: $WORKING_ERA"
        else
          echo "Overclock broke compilation. Keeping only stock baseline artifact."
        fi

    # ==================== STEP 4: EXPORT ARTIFACTS ====================
    - name: Upload Finished Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
